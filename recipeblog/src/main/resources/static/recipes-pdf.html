<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe PDF Collection</title>

    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #26332e;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #27765b;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            color: #27765b;
        }

        #errorMessage {
            color: #bd2929;
        }

        iframe {
            width: 100%;
            height: 700px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            button {
                flex: 1;
            }

            iframe {
                height: 550px;
            }
        }
    </style>
</head>

<body>
<main class="container">

    <h1>📖 Recipe Collection</h1>
    <p>All recipes from your database in one PDF.</p>

    <p id="status" aria-live="polite">
        Loading recipes...
    </p>

    <p id="errorMessage" role="alert"></p>

    <div class="toolbar">
        <button id="previewBtn">Refresh Preview</button>
        <button id="downloadBtn">Download PDF</button>
        <button id="printBtn">Print PDF</button>
    </div>

    <iframe
            id="pdfFrame"
            title="Recipe PDF Preview"
            hidden>
    </iframe>

</main>

<script src="/js/recipes-pdf.js"></script>
</body>
</html>
