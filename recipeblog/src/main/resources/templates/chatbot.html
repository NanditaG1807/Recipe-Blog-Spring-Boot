<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<div th:fragment="widget">

    <div id="chatbot-widget">

        <div id="chatbot-window"
             class="chatbot-window"
             aria-hidden="true">

            <div class="chatbot-header">
                <div>
                    <strong>Recipe Assistant 🍲</strong>

                </div>

                <button type="button"
                        id="chatbot-close"
                        aria-label="Close chatbot">×</button>
            </div>

            <div id="chatbot-messages" aria-live="polite">
                <div class="chat-message bot-message">
                    Hello! Ask me anything about your recipes.
                </div>
            </div>

            <form id="chatbot-form">
                <input id="chatbot-input"
                       type="text"
                       placeholder="Ask about recipes..."
                       maxlength="1000"
                       autocomplete="off"
                       required>

                <button id="chatbot-send" type="submit" style="background-color: #6F9D20; color:white;">
                    Send
                </button>
            </form>

        </div>

        <button type="button"
                id="chatbot-toggle"
                aria-label="Open chatbot"
                aria-expanded="false">
            💬
        </button>

    </div>

    <link rel="stylesheet" th:href="@{/css/chatbot.css}">
    <script th:src="@{/js/chatbot.js}" defer></script>

</div>




</body>
</html>
