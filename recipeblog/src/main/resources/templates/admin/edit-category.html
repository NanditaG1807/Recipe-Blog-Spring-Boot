<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Category</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">
                Edit Category
            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/categories/update}"
                  th:object="${category}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- ID -->
                <input type="hidden"
                       th:field="*{id}">


                <!-- Category Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Category Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>
                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="4"
                              placeholder="Enter category description">
                </textarea>

                </div>


                <!-- Image -->
                <!-- Current Category Image -->
                <div class="mb-3">
                    <label class="form-label">Current Image</label>
                    <br>

                    <img th:if="${category.image != null and !#strings.isEmpty(category.image)}"
                         th:src="@{'/img/' + ${category.image}}"
                         alt="Category Image"
                         style="width:150px;height:100px;object-fit:cover;border-radius:10px;">

                    <span th:if="${category.image == null or #strings.isEmpty(category.image)}">
        No Image
    </span>
                </div>

                <div class="mb-3">
                    <label class="form-label">Change Category Image</label>

                    <input type="file"
                           name="imageFile"
                           class="form-control"
                           accept="image/*">
                </div>

                <!-- Category Type -->
                <div class="mb-3">

                    <label class="form-label">Category Type</label>

                    <select name="categoryType"
                            id="categoryType"
                            class="form-select"
                            required>

                        <option value="MAIN"
                                th:selected="${category.categoryType == 'MAIN'}">
                            Main Category
                        </option>

                        <option value="SUB"
                                th:selected="${category.categoryType == 'SUB'}">
                            Sub Category
                        </option>

                    </select>

                </div>

                <!-- Multiple Parent Category Checkboxes -->
                <div class="mb-3" id="parentCategorySection">

                    <label class="form-label fw-bold">
                        Select Parent Categories
                    </label>

                    <div class="border rounded p-3">

                        <div class="form-check mb-2"
                             th:each="parent : ${parentCategories}">

                            <input class="form-check-input parent-checkbox"
                                   type="checkbox"
                                   name="parentIds"
                                   th:value="${parent.id}"
                                   th:id="${'parent_' + parent.id}"
                                   th:checked="${selectedParentIds.contains(parent.id)}">

                            <label class="form-check-label"
                                   th:for="${'parent_' + parent.id}"
                                   th:text="${parent.name}">
                            </label>

                        </div>

                        <p class="text-muted mb-0"
                           th:if="${#lists.isEmpty(parentCategories)}">
                            No Main Categories available.
                        </p>

                    </div>

                    <small class="text-muted">
                        तुम्ही एक किंवा अधिक Parent Categories निवडू शकता.
                    </small>

                </div>

                <button type="submit"
                        class="btn"
                        style="background-color: #85b72c; color: white; border: none;">
                    Update Category
                </button>


                <a th:href="@{/admin}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const categoryType = document.getElementById("categoryType");
        const parentCategoryDiv = document.getElementById("parentCategoryDiv");
        const parentId = document.getElementById("parentId");

        function toggleParentCategory() {

            const isSub = categoryType.value === "SUB";

            parentCategoryDiv.style.display = isSub ? "block" : "none";
            parentId.required = isSub;

            if (!isSub) {
                parentId.value = "";
            }
        }

        categoryType.addEventListener("change", toggleParentCategory);

        toggleParentCategory();
    });
</script>
</body>
</html>
