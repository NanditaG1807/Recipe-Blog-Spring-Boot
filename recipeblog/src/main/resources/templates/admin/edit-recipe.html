<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Recipe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">
</head>

<body>

<div class="container mt-5 mb-5">

    <h2 class="mb-4">Edit Recipe</h2>

    <form th:action="@{/admin/update-recipe}"
          th:object="${recipe}"
          method="post"
          enctype="multipart/form-data"
          id="recipeForm">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{cardType}">

        <!-- TITLE -->
        <div class="mb-3">
            <label class="form-label">
                Title <span class="text-danger">*</span>
            </label>

            <input type="text"
                   th:field="*{title}"
                   class="form-control"
                   placeholder="Enter recipe title"
                   required>
        </div>

        <!-- RECIPE NAME -->
        <div class="mb-3">
            <label class="form-label">
                Recipe Name <span class="text-danger">*</span>
            </label>

            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   placeholder="Enter recipe name"
                   required>
        </div>

        <!-- DESCRIPTION -->
        <div class="mb-3">
            <label class="form-label">
                Description <span class="text-danger">*</span>
            </label>

            <textarea th:field="*{description}"
                      class="form-control"
                      rows="4"
                      placeholder="Enter recipe description"
                      required></textarea>
        </div>

        <!-- IMAGE -->
        <div class="mb-3">
            <label class="form-label">Current Recipe Image</label>

            <div th:if="${recipe.image != null}">
                <img th:src="@{/img/{filename}(filename=${recipe.image})}"
                     alt="Recipe Image"
                     class="img-thumbnail mb-2"
                     style="max-width: 200px;">
            </div>



            <input type="file"
                   name="imageFile"
                   class="form-control"
                   accept="image/*">
        </div>

        <!-- MAIN CATEGORIES -->
        <div class="mb-4">

            <label class="form-label fw-bold">
                Main Categories
            </label>

            <div class="border rounded p-3">

                <div class="form-check mb-2"
                     th:each="category : ${mainCategories}">

                    <input class="form-check-input category-checkbox main-category"
                           type="checkbox"
                           name="categoryIds"
                           th:value="${category.id}"
                           th:id="${'main-' + category.id}"
                           th:checked="${recipe.categories != null
           and recipe.categories.contains(category)}"
                           th:attr="data-category-id=${category.id}">

                    <label class="form-check-label"
                           th:for="${'main-' + category.id}"
                           th:text="${category.name}">
                        Main Category
                    </label>

                </div>
                <p class="text-muted mb-0"
                   th:if="${#lists.isEmpty(mainCategories)}">
                    No Main Categories available.
                </p>

            </div>



        </div>

        <!-- SUB CATEGORIES -->
        <div class="mb-4">

            <label class="form-label fw-bold">
                Sub Categories
            </label>

            <div class="border rounded p-3">

                <div class="form-check mb-2"
                     th:each="category : ${subCategories}">

                    <input class="form-check-input category-checkbox sub-category"
                           type="checkbox"
                           name="categoryIds"
                           th:value="${category.id}"
                           th:id="${'sub-' + category.id}"
                           th:checked="${recipe.categories != null
           and recipe.categories.contains(category)}"
                           th:attr="data-parent-ids=${#strings.listJoin(
           category.parentCategories.![id.toString()],
           ','
       )}">

                    <label class="form-check-label"
                           th:for="${'sub-' + category.id}"
                           th:text="${category.name}">
                        Sub Category
                    </label>

                </div>

                <p class="text-muted mb-0"
                   th:if="${#lists.isEmpty(subCategories)}">
                    No Sub Categories available.
                </p>

            </div>



        </div>

        <!-- SERVINGS AND COOK TIME -->
        <div class="row mb-3">

            <div class="col-md-6">
                <label class="form-label">
                    Servings <span class="text-danger">*</span>
                </label>

                <input type="number"
                       th:field="*{servings}"
                       class="form-control"
                       min="1"
                       placeholder="Enter servings"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">
                    Cook Time (minutes)
                    <span class="text-danger">*</span>
                </label>

                <input type="number"
                       th:field="*{cookTime}"
                       class="form-control"
                       min="1"
                       placeholder="Enter cook time"
                       required>
            </div>

        </div>
        <!-- FOOD TYPE -->
        <div class="mb-3">
            <label class="form-label fw-bold">
                Food Type <span class="text-danger">*</span>
            </label>

            <div class="d-flex gap-4">

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           th:field="*{foodType}"
                           id="recipeVeg"
                           value="VEG"
                           required>

                    <label class="form-check-label" for="recipeVeg">
                        🟢 Veg
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           th:field="*{foodType}"
                           id="recipeNonVeg"
                           value="NON_VEG"
                           required>

                    <label class="form-check-label" for="recipeNonVeg">
                        🔴 Non-Veg
                    </label>
                </div>

            </div>
        </div>
        <!-- INGREDIENTS -->
        <div class="mb-3">
            <label class="form-label">
                Ingredients <span class="text-danger">*</span>
            </label>

            <textarea th:field="*{ingredients}"
                      class="form-control"
                      rows="6"
                      placeholder="Enter ingredients, one per line..."
                      required></textarea>
        </div>

        <!-- COOKING STEPS -->
        <div class="mb-4">
            <label for="cookingSteps"
                   class="form-label">
                Cooking Steps
                <span class="text-danger">*</span>
            </label>

            <textarea id="cookingSteps"
                      th:field="*{cookingSteps}"
                      class="form-control"
                      rows="8"
                      placeholder="Enter each cooking step on a new line"
                      required></textarea>
        </div>

        <!-- CATEGORY VALIDATION -->
        <div id="categoryError"
             class="alert alert-danger d-none">
            कृपया किमान एक Main Category किंवा Sub Category निवडा.
        </div>

        <!-- BUTTONS -->
        <button type="submit"
                class="btn btn-success">
            Update Recipe
        </button>

        <a th:href="@{/admin}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("recipeForm");
        const mainCheckboxes =
            document.querySelectorAll(".main-category");
        const subCheckboxes =
            document.querySelectorAll(".sub-category");
        const categoryError =
            document.getElementById("categoryError");

        function updateMainCategories() {
            mainCheckboxes.forEach(function (mainCheckbox) {
                const mainId = mainCheckbox.dataset.categoryId;

                const requiredBySelectedSub =
                    Array.from(subCheckboxes).some(function (subCheckbox) {
                        if (!subCheckbox.checked) {
                            return false;
                        }

                        const parentIds =
                            (subCheckbox.dataset.parentIds || "")
                                .split(",")
                                .map(id => id.trim())
                                .filter(Boolean);

                        return parentIds.includes(mainId);
                    });

                if (requiredBySelectedSub) {
                    mainCheckbox.checked = true;
                }
            });
        }

        subCheckboxes.forEach(function (checkbox) {
            checkbox.addEventListener("change", updateMainCategories);
        });

        mainCheckboxes.forEach(function (checkbox) {
            checkbox.addEventListener("change", function () {
                updateMainCategories();
            });
        });

        form.addEventListener("submit", function (event) {
            const selected =
                document.querySelectorAll(".category-checkbox:checked");

            if (selected.length === 0) {
                event.preventDefault();
                categoryError.classList.remove("d-none");
                categoryError.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            } else {
                categoryError.classList.add("d-none");
            }
        });

        updateMainCategories();
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
