<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Category</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Add Category
    </h2>

    <form th:action="@{/admin/categories/save}"
          th:object="${category}"
          method="post"
          enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}"
                      class="form-control"
                      rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Category Image</label>
            <input type="file"
                   name="imageFile"
                   class="form-control"
                   accept="image/*">
        </div>


        <!-- Category Type -->
        <div class="mb-3">
            <label for="categoryType" class="form-label">
                Category Type
            </label>

            <select name="categoryType"
                    id="categoryType"
                    class="form-select"
                    required>
                <option value="MAIN">Main Category</option>
                <option value="SUB">Sub Category</option>
            </select>
        </div>


        <!-- Parent Category Checkboxes -->
        <div class="mb-3" id="parentCategorySection">

            <label class="form-label fw-bold">
                Select Parent Categories
            </label>

            <div class="border rounded p-3">

                <div class="form-check mb-2"
                     th:each="parent : ${parentCategories}">

                    <input class="form-check-input"
                           type="checkbox"
                           name="parentIds"
                           th:value="${parent.id}"
                           th:id="${'parent_' + parent.id}">

                    <label class="form-check-label"
                           th:for="${'parent_' + parent.id}"
                           th:text="${parent.name}">
                    </label>

                </div>

                <p class="text-muted mb-0"
                   th:if="${#lists.isEmpty(parentCategories)}">
                    No Main Categories available.
                </p>

            </div>


        </div>


        <button type="submit" class="btn btn-success">
            Save Category
        </button>

        <a th:href="@{/admin}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>



<script>
    const categoryType = document.getElementById("categoryType");
    const parentSection = document.getElementById("parentCategorySection");

    const parentCheckboxes = document.querySelectorAll(
        'input[name="parentIds"]'
    );

    function toggleParentCategories() {
        const isSub = categoryType.value === "SUB";

        parentSection.style.display = isSub ? "block" : "none";

        parentCheckboxes.forEach(checkbox => {
            checkbox.required = false;

            if (!isSub) {
                checkbox.checked = false;
            }
        });
    }

    categoryType.addEventListener("change", toggleParentCategories);

    toggleParentCategories();
</script>


</body>

</html>
