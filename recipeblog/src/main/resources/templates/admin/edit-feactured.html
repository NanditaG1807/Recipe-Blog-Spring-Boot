
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Featured Recipe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">
</head>

<body>

<div class="container mt-5 mb-5">

    <h2 class="mb-4">Edit Featured Recipe</h2>

    <form th:action="@{/admin/update}"
          th:object="${recipe}"
          method="post"
          enctype="multipart/form-data"
          id="editRecipeForm">

        <input type="hidden" th:field="*{id}">

        <!-- TITLE -->
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text"
                   th:field="*{title}"
                   class="form-control"
                   required>
        </div>

        <!-- RECIPE NAME -->
        <div class="mb-3">
            <label class="form-label">Recipe Name</label>
            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   required>
        </div>

        <!-- DESCRIPTION -->
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}"
                      class="form-control"
                      rows="4"></textarea>
        </div>

        <!-- INGREDIENTS -->
        <div class="mb-3">
            <label class="form-label">Ingredients</label>
            <textarea th:field="*{ingredients}"
                      class="form-control"
                      rows="7"></textarea>
        </div>

        <!-- COOKING STEPS -->
        <div class="mb-3">
            <label class="form-label">Cooking Steps</label>
            <textarea th:field="*{cookingSteps}"
                      class="form-control"
                      rows="10"></textarea>
        </div>

        <!-- MAIN CATEGORIES -->
        <div class="mb-4">

            <label class="form-label fw-bold">
                Main Categories
            </label>

            <div class="border rounded p-3">

                <div class="form-check mb-2"
                     th:each="category : ${categories}"
                     th:if="${category.categoryType == 'MAIN'}">

                    <input class="form-check-input category-checkbox main-category"
                           type="checkbox"
                           name="categoryIds"
                           th:value="${category.id}"
                           th:id="${'main-' + category.id}"
                           th:attr="data-category-id=${category.id}"
                           th:checked="${recipe.categories != null and recipe.categories.contains(category)}">

                    <label class="form-check-label"
                           th:for="${'main-' + category.id}"
                           th:text="${category.name}">
                    </label>

                </div>

            </div>
        </div>

        <!-- SUB CATEGORIES -->
        <div class="mb-4">

            <label class="form-label fw-bold">
                Sub Categories
            </label>

            <div class="border rounded p-3">

                <div class="form-check mb-2"
                     th:each="category : ${categories}"
                     th:if="${category.categoryType == 'SUB'}">

                    <input class="form-check-input category-checkbox sub-category"
                           type="checkbox"
                           name="categoryIds"
                           th:value="${category.id}"
                           th:id="${'sub-' + category.id}"
                           th:attr="data-parent-ids=${#strings.listJoin(
                               category.parentCategories.![id.toString()],
                               ','
                           )}"
                           th:checked="${recipe.categories != null and recipe.categories.contains(category)}">

                    <label class="form-check-label"
                           th:for="${'sub-' + category.id}"
                           th:text="${category.name}">
                    </label>

                </div>

            </div>


        </div>

        <!-- CURRENT IMAGE -->
        <div class="mb-3">

            <label class="form-label">Current Image</label>
            <br>

            <img th:if="${recipe.image != null and !#strings.isEmpty(recipe.image)}"
                 th:src="@{'/img/' + ${recipe.image}}"
                 alt="Recipe Image"
                 style="width:150px;
                        height:100px;
                        object-fit:cover;
                        border-radius:10px;
                        margin-bottom:10px;">

            <span th:if="${recipe.image == null or #strings.isEmpty(recipe.image)}">
                No Image
            </span>
        </div>

        <!-- NEW IMAGE -->
        <div class="mb-3">
            <label class="form-label">Change Recipe Image</label>

            <input type="file"
                   name="imageFile"
                   class="form-control"
                   accept="image/*">
        </div>

        <!-- SERVINGS AND COOK TIME -->
        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Servings</label>

                <input type="number"
                       th:field="*{servings}"
                       class="form-control"
                       min="1">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">
                    Cook Time (minutes)
                </label>

                <input type="number"
                       th:field="*{cookTime}"
                       class="form-control"
                       min="1">
            </div>

        </div>
        <!-- VEG / NON-VEG -->

        <!-- FOOD TYPE - FEATURED EDIT -->
        <div class="mb-3">
            <label class="form-label fw-bold">
                Food Type <span class="text-danger">*</span>
            </label>

            <div class="d-flex gap-4">

                <!-- VEG -->
                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           th:field="*{foodType}"
                           id="featuredVeg"
                           value="VEG"
                           required>

                    <label class="form-check-label"
                           for="featuredVeg">
                        🟢 Veg
                    </label>
                </div>

                <!-- NON-VEG -->
                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           th:field="*{foodType}"
                           id="featuredNonVeg"
                           value="NON_VEG"
                           required>

                    <label class="form-check-label"
                           for="featuredNonVeg">
                        🔴 Non-Veg
                    </label>
                </div>

            </div>
        </div>

        <!-- CATEGORY VALIDATION -->
        <div id="categoryError"
             class="alert alert-danger d-none">

        </div>

        <!-- BUTTONS -->
        <button type="submit" class="btn btn-primary">
            Update Recipe
        </button>

        <a th:href="@{/admin}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("editRecipeForm");

        const mainCheckboxes =
            document.querySelectorAll(".main-category");

        const subCheckboxes =
            document.querySelectorAll(".sub-category");

        const categoryError =
            document.getElementById("categoryError");

        // Main category निवडल्यास ती आपोआप uncheck करू नका.
        subCheckboxes.forEach(function (subCheckbox) {

            subCheckbox.addEventListener("change", function () {

                if (subCheckbox.checked) {

                    const parentIds =
                        (subCheckbox.dataset.parentIds || "")
                            .split(",")
                            .map(id => id.trim())
                            .filter(Boolean);

                    parentIds.forEach(function (parentId) {

                        const parentCheckbox =
                            document.getElementById("main-" + parentId);

                        if (parentCheckbox) {
                            parentCheckbox.checked = true;
                        }
                    });
                }
            });
        });

        // किमान एक Category आवश्यक.
        form.addEventListener("submit", function (event) {

            const selectedCategories =
                document.querySelectorAll(
                    ".category-checkbox:checked"
                );

            if (selectedCategories.length === 0) {

                event.preventDefault();

                categoryError.classList.remove("d-none");

                categoryError.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            } else {
                categoryError.classList.add("d-none");
            }
        });

    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
