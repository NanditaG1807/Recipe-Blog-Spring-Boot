<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<div class="forgot-container">
<div class="forgot-box">

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your email and create a new password.
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/forgot-password}"
          method="post">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

        </div>

        <div class="form-group">

            <label for="password">
                New Password
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter new password"
                   required>

        </div>

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm new password"
                   required>

        </div>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p class="login-text">
        Remember your password?

        <a th:href="@{/login}">
            Login
        </a>
    </p>

</div>
</div>

</body>

</html>
