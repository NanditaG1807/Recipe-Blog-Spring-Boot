<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}"
          href="/css/login.css">

    <script th:src="@{/js/script.js}"
            src="/js/script.js"></script>
</head>

<body>

<div class="register-container">
<div class="login-card">

    <h2>Login</h2>

    <form th:action="@{/login}" method="post">

        <div class="field-group">

            <label>Email:</label>

            <input type="email"
                   name="username"
                   placeholder="Enter email"
                   required>

        </div>


        <div class="field-group">

            <label>Password:</label>

            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <a th:href="@{/forgot-password}">
                Forgot password?
            </a>

        </div>


        <button type="submit">
            Login
        </button>

        <br><br>

        Don't have an account?
        <a th:href="@{/register}">
            Register
        </a>

    </form>

</div>
</div>
</body>
</html>
